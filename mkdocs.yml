site_name: FIN 325 Applied Finance Lab
site_description: Finance for Managers | Saint Leo University
site_author: Zachary Smith
site_url: https://prof-smith.github.io/fin325-applied-finance-lab

theme:
  name: material

  logo: assets/branding/logo.svg
  favicon: assets/branding/favicon.png

  palette:

    # Light Mode
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to Dark Mode

    # Dark Mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to Light Mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.expand

    - search.highlight
    - search.share
    - search.suggest

    - content.code.copy
    - content.tabs.link

    - toc.follow

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/custom.js

markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - tables

  - footnotes

  - pymdownx.highlight

  - pymdownx.superfences

  - pymdownx.inlinehilite

  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji

plugins:
  - search

extra:

  social:
    - icon: fontawesome/solid/graduation-cap
      link: /

  generator: false

copyright: >
  © 2026 Saint Leo University |
  FIN 325 Applied Finance Lab

