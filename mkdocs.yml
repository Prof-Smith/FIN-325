site_name: FIN 325 Applied Finance Lab
site_description: Finance for Managers | Build, Analyze, Decide
site_author: Zachary Smith
site_url: https://prof-smith.github.io/FIN-325/
repo_name: Prof-Smith/FIN-325
repo_url: https://github.com/Prof-Smith/FIN-325
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/branding/logo.svg
  favicon: assets/branding/favicon.svg
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
extra_css:
  - assets/css/custom.css
  - assets/css/tvm-tools.css
  - assets/css/bond-tools.css
  - assets/css/equity-tools.css
  - assets/css/risk-return-tools.css
  - assets/css/wacc-tools.css
  - assets/css/capital-budgeting-tools.css
  - assets/css/strategic-finance-tools.css
extra_javascript:
  - https://cdn.plot.ly/plotly-3.6.0.min.js
  - assets/js/custom.js
  - assets/js/tvm-tools.js
  - assets/js/bond-tools.js
  - assets/js/equity-tools.js
  - assets/js/risk-return-tools.js
  - assets/js/wacc-tools.js
  - assets/js/capital-budgeting-tools.js
  - assets/js/strategic-finance-tools.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
extra:
  generator: false
  course:
    name: FIN 325 Applied Finance Lab
    framework: Build -> Analyze -> Decide
    owner: Zachary Smith
copyright: >
  FIN 325 Applied Finance Lab. Course materials prepared by Zachary Smith.
